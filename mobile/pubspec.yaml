name: esp_calc_mobile
description: Free Fire Esports Tournament Calculator & Broadcast Standings Studio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  gal: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/poster/
    - assets/poster/assets/

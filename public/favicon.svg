<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F080B" />
      <stop offset="50%" stop-color="#120507" />
      <stop offset="100%" stop-color="#050102" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Esports Shield Background -->
  <path d="M32 3 L58 12 V34 C58 48 46 59 32 63 C18 59 6 48 6 34 V12 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Glow Accent -->
  <path d="M32 7 L54 15 V33 C54 45 44 55 32 59 C20 55 10 45 10 33 V15 Z" fill="#0C0406" stroke="url(#fireGrad)" stroke-width="1.2" opacity="0.8" />

  <!-- Trophy Flame / Crown -->
  <path d="M32 14 L35.5 22 L44 22 L37 27 L39.5 35 L32 30.5 L24.5 35 L27 27 L20 22 L28.5 22 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Trophy Cup Body -->
  <path d="M22 26 H42 V35 C42 40.5 37.5 45 32 45 C26.5 45 22 40.5 22 35 Z" fill="url(#goldGrad)" />
  <!-- Cup Cutout / Inner shading -->
  <path d="M25 28 H39 V34 C39 37.8 35.8 41 32 41 C28.2 41 25 37.8 25 34 Z" fill="#140608" />

  <!-- Trophy Handles -->
  <path d="M22 29 H17 C15.5 29 15 30 15 31.5 C15 36 19 38 22 38" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M42 29 H47 C48.5 29 49 30 49 31.5 C49 36 45 38 42 38" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Trophy Stem and Base -->
  <rect x="29.5" y="44" width="5" height="6" fill="url(#goldGrad)" />
  <path d="M23 50 L25 48 H39 L41 50 L43 53 H21 Z" fill="url(#goldGrad)" />

  <!-- Central Star Sparkle -->
  <circle cx="32" cy="34" r="2" fill="#FFFFFF" filter="url(#glow)" />
</svg>
